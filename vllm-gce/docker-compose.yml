services:
  vllm:
    image: vllm/vllm-openai:v0.30.0
    container_name: vllm-server
    restart: unless-stopped

    ports:
      - "8000:8000"
    networks:
      - shared-network

    # Required: Prevents PyTorch shared memory (shm) bottlenecks during tensor parallelism
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      # Caches model weights on the host to avoid redundant downloads on container restart
      - /home/ubuntu/.cache/huggingface:/root/.cache/huggingface

    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_LOGGING_LEVEL=INFO
      
    command: >
      Qwen/Qwen2.5-14B-Instruct-AWQ
      --quantization awq
      --served-model-name ${MODEL_NAME}
      --gpu-memory-utilization 0.90
      --max-model-len 512
      --max-num-seqs 256
      --enable-prefix-caching
      --api-key ${VLLM_API_KEY}

networks:
  shared-network:
    external: true
    name: shared-monitor-network