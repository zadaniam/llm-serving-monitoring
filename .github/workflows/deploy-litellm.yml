name: Deploy LiteLLM to Cloud Run

on:
  push:
    branches: [ main ]
    paths:
      - 'litellm-proxy/**'
      - '.github/workflows/deploy-litellm.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud via WIF
      id: auth
      uses: google-github-actions/auth@v2
      with:
        project_id: ${{ vars.PROJECT_ID }}
        workload_identity_provider: ${{ vars.WIF_PROVIDER }}
        service_account: 'litellm-deployer@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet

    - name: Build and Push LiteLLM Image
      uses: docker/build-push-action@v6
      with:
        context: ./litellm-proxy
        file: ./litellm-proxy/Dockerfile
        push: true
        tags: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.GAR_REPO }}/litellm:${{ github.sha }}

    - name: Deploy LiteLLM to Cloud Run
      id: deploy-litellm
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: litellm-vllm
        region: ${{ vars.REGION }}
        image: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.GAR_REPO }}/litellm:${{ github.sha }}
        flags: '--allow-unauthenticated'
        env_vars: |
          LITELLM_MODE=production
        secrets: |
          VLLM_API_KEY=VLLM_API_KEY:latest
          GROQ_API_KEY=GROQ_API_KEY:latest
          GEMINI_KEY_3_5=GEMINI_API_KEY_3_5:latest
          GEMINI_KEY_2_5=GEMINI_API_KEY_2_5:latest
          LITELLM_MASTER_KEY=LITELLM_MASTER_KEY:latest